name: CI

# Builds the solution and runs every check that does not need a human at the
# keyboard: the desktop-free unit checks and the offscreen render harness. The
# render harness creates real windows and asks DWM about the title bar, so it
# skips itself with a stated reason on a runner that cannot host a window rather
# than reporting a failure the machine caused. The desktop probe is not run here:
# it moves the real cursor and captures the real screen.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PixelPin.sln

      - name: Build (Release, warnings as errors)
        run: dotnet build PixelPin.sln -c Release --no-restore -warnaserror

      - name: Unit checks
        run: dotnet run --project tests\PixelPin.Tests\PixelPin.Tests.csproj -c Release --no-build

      # The harness writes renders into artifacts/ui-review, which is gitignored. It
      # exits 0 with an explicit "skipped" line when the runner cannot host windows,
      # so a green run here always means the checks really ran.
      - name: Offscreen render checks
        run: dotnet run --project tests\PixelPin.UiRender -c Debug

      - name: Keep render output for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-review
          path: artifacts/ui-review
          if-no-files-found: ignore
          retention-days: 7
